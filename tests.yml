name: TechnoPulse QA Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies for Audio (libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html requests librosa soundfile numpy playwright pytest-playwright
          playwright install --with-deps chromium

      - name: Run Pytest Suite & Generate Report
        run: |
          pytest --html=report.html --self-contained-html -v

      - name: Upload HTML Test Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html